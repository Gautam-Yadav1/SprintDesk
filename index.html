<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SprintDesk — sprint management dashboard with a Kanban board, task analytics and activity notifications."
    />
    <title>SprintDesk</title>
    <script>
      // Applied before first paint so a dark-theme reload never flashes light.
      try {
        var stored = JSON.parse(localStorage.getItem('sprintdesk.theme') || 'null')
        var theme = stored && stored.state && stored.state.theme
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.classList.toggle('dark', theme === 'dark')
      } catch (e) {
        /* first visit, or storage blocked: fall through to the light default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
