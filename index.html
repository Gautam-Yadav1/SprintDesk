<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Field Notes type: Caveat is the handwriting (greetings, section heads,
      the wordmark, stat figures), Source Serif 4 is the body and card copy,
      JetBrains Mono carries every label, date and badge.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <meta
      name="description"
      content="SprintDesk — sprint management dashboard with a Kanban board, task analytics and activity notifications."
    />
    <title>SprintDesk</title>
    <script>
      // Applied before first paint so a dark-theme reload never flashes light.
      try {
        var stored = JSON.parse(localStorage.getItem('sprintdesk.theme') || 'null')
        var theme = stored && stored.state && stored.state.theme
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.classList.toggle('dark', theme === 'dark')
      } catch (e) {
        /* first visit, or storage blocked: fall through to the light default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
