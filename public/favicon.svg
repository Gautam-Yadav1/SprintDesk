<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SprintDesk">
  <!-- background square, soft paper tone -->
  <rect width="64" height="64" rx="12" fill="#F5EFE1"/>

  <!-- pinned index card, centered and slightly rotated -->
  <g transform="translate(8,8) rotate(-6 24 24)">
    <rect x="2" y="4" width="44" height="44" rx="2" fill="#FFFDF8" stroke="#E2D5B8" stroke-width="1.6"/>
    <!-- sticky tab -->
    <rect x="13" y="-4" width="15" height="11" fill="#B23A2E"/>
    <!-- ruled lines -->
    <line x1="10" y1="27" x2="38" y2="27" stroke="#E2D5B8" stroke-width="2" stroke-dasharray="3 3"/>
    <line x1="10" y1="35" x2="30" y2="35" stroke="#E2D5B8" stroke-width="2" stroke-dasharray="3 3"/>
    <!-- pin -->
    <circle cx="20" cy="10" r="3" fill="#B23A2E"/>
  </g>
</svg>
